<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f8f6f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11151b" media="(prefers-color-scheme: dark)">
  <title>MAF Lernumgebung</title>
  <meta name="description" content="Lernumgebung zum Repetitorium Mitarbeiterführung (MAF), quellengebunden am Vorlesungsskript.">
  <!-- iPhone und iPad im Safari sind die Hauptgeräte: keine automatischen Telefonlinks aus Zahlen im Lernstoff,
       eigenes Symbol für den Home-Bildschirm. Bewusst KEIN apple-mobile-web-app-capable: als eigenständige
       Web-App hätte die Seite einen getrennten Speicher (Lernstand wäre doppelt) und könnte nicht drucken. -->
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <meta name="apple-mobile-web-app-title" content="MAF lernen">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="icon" href="assets/symbol.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/basis.css">
  <link rel="stylesheet" href="assets/css/komponenten.css">
  <link rel="stylesheet" href="assets/css/diagramme.css">
  <link rel="stylesheet" href="assets/css/aufgaben.css">
  <link rel="stylesheet" href="assets/css/aufgaben-ordnen.css">
  <link rel="stylesheet" href="assets/css/aufgaben-luecke.css">
  <link rel="stylesheet" href="assets/css/ansicht-start.css">
  <link rel="stylesheet" href="assets/css/ansicht-lernen.css">
  <link rel="stylesheet" href="assets/css/ansicht-training.css">
  <link rel="stylesheet" href="assets/css/ansicht-nachschlagen.css">
  <link rel="stylesheet" href="assets/css/lernzettel.css">
  <script>
    // Thema vor dem ersten Zeichnen setzen, damit nichts aufblitzt
    try {
      var s = JSON.parse(localStorage.getItem('maf-lernstand-v1') || 'null');
      var t = s && s.einstellungen && s.einstellungen.thema;
      if (t === 'hell' || t === 'dunkel') document.documentElement.setAttribute('data-thema', t);
    } catch (e) {}
  </script>
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
  <a class="sprunglink" href="#inhalt">Zum Inhalt springen</a>

  <header class="kopf">
    <div class="kopf__innen">
      <a class="marke" href="#/" aria-label="MAF Lernumgebung, Startseite">
        <span class="marke__kuerzel">MAF</span>
        <span>Lernumgebung</span>
        <span class="marke__zusatz">Mitarbeiterführung · Repetitorium</span>
      </a>
      <nav class="hauptnav" aria-label="Hauptnavigation" id="hauptnav"></nav>
      <span class="kopf__zeit" id="kopf-zeit" title="Aktive Lernzeit von deinem Zeitbudget" hidden></span>
    </div>
  </header>

  <main id="inhalt" class="seite" tabindex="-1">
    <p class="ladeanzeige">Lernumgebung wird geladen …</p>
  </main>

  <nav class="fussnav" aria-label="Navigation" id="fussnav"></nav>

  <noscript>
    <div class="hinweiskasten hinweiskasten--mittel">
      <p>Diese Lernumgebung braucht JavaScript. Bitte aktiviere es in deinem Browser.</p>
    </div>
  </noscript>
</body>
</html>
